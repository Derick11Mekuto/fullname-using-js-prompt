<html>
<head>
    <title> Full Name</title>
</head>
<body>

    <h2> JavaScript Prompt Practice</h2>

<script>
//prompt enter name
var name = prompt("Enter name:");

//prompt the user to enter surname
var surname = prompt("Enter surname:");

//convert the input
var fullName = name +""+ surname ;

//display them 
document.write("Your full name is: " + fullName);
    
    
</script>
</body>
</html>
